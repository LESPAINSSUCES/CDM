<script>
const LS_EMAIL_KEY = 'cdm2026_email';
const LS_RANK_MODE_KEY = 'cdm2026_rank_mode';
let highlightEmail = '';
let rankMode = 'matchs';
let lastRows = [];
const formatScoreCell = CDM_SCORING.formatScoreCell || ((v, vis) => (vis ? v : '—'));
const { scoreParticipant, normalizeTeam } = CDM_SCORING;
const FETCH_TIMEOUT_MS = 20000;

function rankModeHintHtml() {
  return rankMode === 'complet'
    ? 'Classement <strong>complet</strong> (poules + phase finale + bonus).'
    : 'Classement <strong>matchs</strong> (poules + phase finale, sans bonus).';
}

function sortRows(rows) {
  const key = rankMode === 'complet' ? 'total' : 'totalSansBonus';
  return [...rows].sort((a, b) => b[key] - a[key] || a.label.localeCompare(b.label, 'fr'));
}

function displayTotal(r) {
  return rankMode === 'complet' ? r.total : r.totalSansBonus;
}

function monScoreHref(email) {
  if (!email) return '#';
  const q = 'mon-score.html?email=' + encodeURIComponent(email);
  return window.CDM_LEAGUE ? CDM_LEAGUE.withLeague(q) : q;
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      setTimeout(() => reject(new Error((label || 'Chargement') + ' trop long — réessayez.')), ms);
    }),
  ]);
}

function renderTable(rows) {
  if (!rows.length) {
    return '<div class="empty"><p>Aucun participant pour le moment.</p><p style="margin-top:.75rem">Les joueurs envoient leur grille depuis l’onglet <strong>📤 Envoyer</strong>.</p></div>';
  }
  const showBonus = rankMode === 'complet';
  const totalLabel = showBonus ? 'Total' : 'Total matchs';
  const normHighlight = normalizeTeam(highlightEmail);
  const trs = rows.map((r, i) => {
    const detail = r.email
      ? `<a class="lb-link" href="${monScoreHref(r.email)}">Détail</a>`
      : '—';
    const isMe = normHighlight && normalizeTeam(r.email) === normHighlight;
    const bonusCell = showBonus
      ? `<td class="pts${r.visible?.bonusCompetition ? '' : ' pts-muted'}">${formatScoreCell(r.bonus, r.visible?.bonus)}</td>`
      : '';
    return `
    <tr class="${isMe ? 'lb-row-me' : ''}">
      <td class="rank">${i + 1}</td>
      <td><div class="name">${escapeHtml(r.label)}${isMe ? ' <span style="color:var(--gold);font-size:.75rem">← vous</span>' : ''}</div><div class="sub">${escapeHtml(r.sub || '')}</div></td>
      <td class="pts${r.visible?.poules ? '' : ' pts-muted'}">${formatScoreCell(r.poules, r.visible?.poules)}</td>
      <td class="pts${r.visible?.tableauE2 ? '' : ' pts-muted'}">${formatScoreCell(r.tableauE2, r.visible?.tableauE2 !== false)}</td>
      <td class="pts${r.visible?.finales ? '' : ' pts-muted'}">${formatScoreCell(r.finales, r.visible?.finales)}</td>
      ${bonusCell}
      <td class="pts total">${displayTotal(r)}</td>
      <td class="col-detail">${detail}</td>
    </tr>`;
  }).join('');
  const bonusHead = showBonus ? '<th class="col-pts">Bonus</th>' : '';
  return `<div class="leaderboard-wrap"><table class="lb"><thead><tr>
    <th class="col-rank">#</th>
    <th class="col-name">Participant</th>
    <th class="col-pts">Poules</th>
    <th class="col-pts">Phase fin.<br>tableau</th>
    <th class="col-pts">Phase fin.<br>scores</th>
    ${bonusHead}
    <th class="col-pts">${totalLabel}</th>
    <th class="col-detail">Détail</th>
  </tr></thead><tbody>${trs}</tbody></table></div>`;
}

function renderMyScoreSummary(rows) {
  const card = document.getElementById('myScoreCard');
  const el = document.getElementById('myScoreSummary');
  if (!el || !card) return;
  if (!highlightEmail) {
    card.classList.add('hidden');
    return;
  }
  const norm = normalizeTeam(highlightEmail);
  const idx = rows.findIndex(r => normalizeTeam(r.email) === norm);
  if (idx < 0) {
    card.classList.add('hidden');
    return;
  }
  const r = rows[idx];
  const detailLink = r.email
    ? `<a class="lb-link" href="${monScoreHref(r.email)}">Détail match par match →</a>`
    : '';
  const bonusLine = rankMode === 'complet'
    ? ` · Bonus ${formatScoreCell(r.bonus, r.visible?.bonus)}`
    : '';
  el.innerHTML = `
    <span class="rank-big">#${idx + 1}</span>
    <span><strong>${escapeHtml(r.label)}</strong> <span style="color:var(--gold);font-size:.75rem">← vous</span><br><span style="color:var(--muted);font-size:.8rem">Poules ${formatScoreCell(r.poules, r.visible?.poules)} · Ph. fin. tab. ${formatScoreCell(r.tableauE2, r.visible?.tableauE2)} · Ph. fin. scores ${formatScoreCell(r.finales, r.visible?.finales)}${bonusLine}</span></span>
    <span class="pts-big">${displayTotal(r)} pts</span>
    ${detailLink}`;
  card.classList.remove('hidden');
}

function loadStoredEmail() {
  try {
    const grid = localStorage.getItem('cdm2026_grid');
    if (grid) {
      const st = JSON.parse(grid);
      const em = (st.identite?.email || '').trim();
      if (em) return em;
    }
    const direct = localStorage.getItem(LS_EMAIL_KEY);
    if (direct) return direct.trim();
  } catch (e) { /* ignore */ }
  return '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' (' + res.status + ')');
  return res.json();
}

async function loadParticipants() {
  if (window.CDM_SUPABASE?.loadParticipantsMerged) {
    return CDM_SUPABASE.loadParticipantsMerged(loadJson);
  }
  const data = await loadJson('data/participants.json');
  return data.participants || [];
}

async function refresh() {
  const errEl = document.getElementById('errLine');
  const metaEl = document.getElementById('metaLine');
  const content = document.getElementById('content');
  errEl.hidden = true;
  metaEl.textContent = 'Chargement…';
  content.innerHTML = '<div class="empty">Chargement du classement…</div>';
  try {
    const [participants, resultats] = await Promise.all([
      withTimeout(loadParticipants(), FETCH_TIMEOUT_MS, 'Participants'),
      withTimeout(loadJson('data/resultats.json'), FETCH_TIMEOUT_MS, 'Résultats'),
    ]);
    const etape = resultats.etapeDebloquee || 0;
    lastRows = participants.map(p => {
      const id = p.identite || {};
      const label = [id.prenom, id.nom].filter(Boolean).join(' ') || 'Anonyme';
      const sub = id.equipe || '';
      const sc = scoreParticipant(p, resultats);
      const email = (id.email || '').trim();
      return { label, sub, email, ...sc };
    });
    const rows = sortRows(lastRows);

    const maj = resultats.meta?.misAJour || 'non renseignée';
    const leagueLabel = window.CDM_LEAGUE ? CDM_LEAGUE.label(CDM_LEAGUE.current()) : 'Pains sucés';
    metaEl.innerHTML = 'Ligue : <strong>' + escapeHtml(leagueLabel) + '</strong> · Étape officielle : <strong>' + etape + '</strong> · Dernière MAJ : <strong>' + escapeHtml(maj) + '</strong> — '
      + participants.length + ' participant(s). ' + rankModeHintHtml();
    content.innerHTML = renderTable(rows);
    renderMyScoreSummary(rows);
    if (highlightEmail && document.querySelector('.lb-row-me')) {
      requestAnimationFrame(() => {
        document.querySelector('.lb-row-me')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }
  } catch (e) {
    errEl.textContent = 'Erreur de chargement : ' + e.message + '. Ouvrez la page via un serveur local si les JSON sont bloqués (file://).';
    errEl.hidden = false;
    metaEl.textContent = 'Impossible de charger les données.';
    content.innerHTML = '<div class="empty"><p>En attente de données valides.</p></div>';
  }
}

function setRankMode(mode) {
  rankMode = mode === 'complet' ? 'complet' : 'matchs';
  try { localStorage.setItem(LS_RANK_MODE_KEY, rankMode); } catch (e) { /* ignore */ }
  const btnMatchs = document.getElementById('rankModeMatchs');
  const btnComplet = document.getElementById('rankModeComplet');
  if (btnMatchs && btnComplet) {
    btnMatchs.classList.toggle('active', rankMode === 'matchs');
    btnComplet.classList.toggle('active', rankMode === 'complet');
    btnMatchs.setAttribute('aria-selected', rankMode === 'matchs' ? 'true' : 'false');
    btnComplet.setAttribute('aria-selected', rankMode === 'complet' ? 'true' : 'false');
  }
  if (!lastRows.length) return;
  const rows = sortRows(lastRows);
  document.getElementById('content').innerHTML = renderTable(rows);
  renderMyScoreSummary(rows);
  const metaEl = document.getElementById('metaLine');
  if (metaEl && !metaEl.textContent.startsWith('Chargement') && metaEl.textContent !== 'Impossible de charger les données.') {
    const html = metaEl.innerHTML;
    const sep = html.indexOf(' participant(s). ');
    if (sep >= 0) metaEl.innerHTML = html.slice(0, sep + 17) + rankModeHintHtml();
  }
}

function bootClassement() {
  try {
    const saved = localStorage.getItem(LS_RANK_MODE_KEY);
    if (saved === 'complet' || saved === 'matchs') rankMode = saved;
  } catch (e) { /* ignore */ }
  highlightEmail = loadStoredEmail();
  if (window.CDM_LEAGUE_BAR) {
    CDM_LEAGUE_BAR.mount('league-bar', 'classement.html');
    CDM_LEAGUE_BAR.wireNavLinks();
  }
  if (window.CDM_LIVE_SCORES?.mount) CDM_LIVE_SCORES.mount('live-scores-root');
  setRankMode(rankMode);
  refresh();
  setInterval(refresh, 5 * 60 * 1000);
}

document.getElementById('btnRefresh').addEventListener('click', e => { e.preventDefault(); refresh(); });
document.getElementById('rankModeMatchs').addEventListener('click', () => setRankMode('matchs'));
document.getElementById('rankModeComplet').addEventListener('click', () => setRankMode('complet'));

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootClassement);
} else {
  bootClassement();
}
</script>
</body>
</html>
